name: blurag-poc

x-cli: &cli
  image: blurag-poc:local
  build: .
  working_dir: /app
  environment:
    BLURAG_HOME: /app/.blurag
    BLURAG_QDRANT_URL: http://qdrant:6333
    BLURAG_THREADS: "4"
  volumes:
    - ./src:/app/src:ro
    - ./tests:/app/tests:ro
    - ./pyproject.toml:/app/pyproject.toml:ro
    - ./data:/app/data
    - ./.blurag:/app/.blurag

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__LOG_LEVEL: WARN
    volumes:
      - ./.blurag/qdrant:/qdrant/storage
    networks: [offline]
    restart: "no"
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  cli:
    <<: *cli
    profiles: [cli]
    depends_on:
      qdrant:
        condition: service_healthy
    networks: [offline]

  prepare:
    <<: *cli
    profiles: [setup]
    entrypoint: [blurag]
    command: [prepare]
    networks: [downloads]

networks:
  offline:
    internal: true
  downloads: {}
